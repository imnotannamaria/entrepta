name: Release

on:
  push:
    branches: [main]

# Never let two releases run at once. A queued run must wait, not cancel, or a
# publish could be interrupted halfway through the two packages.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # With changesets pending, this opens or updates the "Version Packages"
      # PR. With none pending, which is what merging that PR looks like, it
      # publishes to npm and pushes the tags. changeset publish shells out to
      # pnpm publish, so workspace:* in the CLI becomes the real registry
      # version, and the packages go out in dependency order.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
