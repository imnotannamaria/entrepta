name: Release

on:
  push:
    branches: [main]

# Never let two releases run at once. A queued run must wait, not cancel, or a
# publish could be interrupted halfway through the two packages.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Lets npm mint a short-lived publish credential for this job. Required
      # by trusted publishing, which is why there is no NPM_TOKEN here.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing needs npm >=11.5.1. The npm bundled with a
      # given Node 22 build lags behind that, so pin it explicitly rather
      # than gamble on whatever ships with the runner today.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # With changesets pending, this opens or updates the "Version Packages"
      # PR. With none pending, which is what merging that PR looks like, it
      # runs scripts/npm-publish-ci.sh to publish and pushes the tags.
      #
      # That script exists instead of the default `changeset publish` because
      # changeset publish always shells out to `pnpm publish` when it finds a
      # pnpm-lock.yaml, and pnpm publish's own passthrough to npm does not
      # reliably do npm's OIDC trusted-publishing handshake. See the comment
      # at the top of the script for the pnpm issue this is tracked on.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: bash scripts/npm-publish-ci.sh
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
